<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>中高数学マップ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* layout: 路線図。横軸=学年、縦軸=4つの系統。駅(単元)を選ぶと下に教科書1ページ分の解説が開く */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --sunk:#e9edea; --ink:#18262b; --muted:#56666b; --line:#d3dad6;
  --alg:#2459c4; --fn:#c8451f; --geo:#0b7f62; --dat:#7d43bd; --on-c:#ffffff;
  --f-display:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11181b; --surface:#1a2428; --sunk:#151d20; --ink:#e5ebe8; --muted:#9aa9a8; --line:#2e3b40;
  --alg:#78a6ff; --fn:#ff8f66; --geo:#45cfa2; --dat:#c394f7; --on-c:#10171a; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11181b; --surface:#1a2428; --sunk:#151d20; --ink:#e5ebe8; --muted:#9aa9a8; --line:#2e3b40;
  --alg:#78a6ff; --fn:#ff8f66; --geo:#45cfa2; --dat:#c394f7; --on-c:#10171a; color-scheme:dark }

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px}
.top h1{font-family:var(--f-display);font-weight:900;font-size:clamp(26px,4vw,36px);line-height:1.2;letter-spacing:.02em}
.top .sub{color:var(--muted);max-width:44em}
.progress{font-family:var(--f-mono);font-size:13px;color:var(--muted);white-space:nowrap}
.progress b{color:var(--ink);font-weight:500;font-size:18px}

/* map */
.map-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.map{position:relative}
.map svg{position:absolute;inset:0;pointer-events:none}
.col-h{position:absolute;top:0;height:44px;display:flex;align-items:center;justify-content:center;gap:6px;
  font-weight:700;font-size:13px;border-bottom:1px solid var(--line)}
.col-h small{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.06em}
.col-h.hs-first{border-left:1px dashed var(--line)}
.row{position:absolute;left:0;right:0;border-bottom:1px solid var(--line)}
.row:last-of-type{border-bottom:0}
.row span{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:76px;font-weight:700;font-size:13px;line-height:1.35;color:var(--c)}
.node{position:absolute;width:152px;height:34px;display:flex;align-items:center;gap:8px;padding:0 10px;
  background:var(--surface);border:1.5px solid var(--line);border-radius:17px;color:var(--ink);
  font:500 12.5px/1 var(--f-body);cursor:pointer;text-align:left;white-space:nowrap;transition:opacity .15s}
.node::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;border:2.5px solid var(--c);background:var(--surface)}
.node.done::before{background:var(--c)}
.node:hover{border-color:var(--c)}
.node:focus-visible,.chip:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.map.has-sel .node{opacity:.36}
.map.has-sel .node.sel,.map.has-sel .node.pre,.map.has-sel .node.next{opacity:1}
.node.pre{border-color:var(--c);border-style:dashed}
.node.next{border-color:var(--c);border-width:2px}
.node.sel{background:var(--c);border-color:var(--c);color:var(--on-c);font-weight:700}
.node.sel::before{border-color:var(--on-c);background:var(--c)}
.edge{fill:none;stroke-width:1.5;opacity:.32;transition:opacity .15s}
.map.has-sel .edge{opacity:.07}
.map.has-sel .edge.on{opacity:1;stroke-width:2.2}
.map.has-sel .edge.on.pre{stroke-dasharray:5 4}
.legend{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:26px;height:12px;border-radius:6px;border:1.5px solid var(--muted);vertical-align:-2px;margin-right:6px}
.legend .l-pre{border-style:dashed}
.legend .l-next{border-width:2.5px}
.legend .l-done{width:12px;border-radius:50%;background:var(--muted)}

/* detail */
.detail{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:10px;padding:clamp(18px,3vw,32px);
  display:flex;flex-direction:column;gap:24px;scroll-margin-top:12px}
.d-head{display:flex;flex-direction:column;gap:8px}
.crumb{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--c)}
.d-head h2{font-family:var(--f-display);font-weight:900;font-size:clamp(24px,3.4vw,32px);line-height:1.25}
.lead{font-size:16px;max-width:38em}
.done-l{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;width:fit-content}
.done-l input{accent-color:var(--c);width:16px;height:16px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px);gap:28px 40px}
.main,.side{display:flex;flex-direction:column;gap:26px;min-width:0}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h3{font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--muted)}
.points{margin:0;display:flex;flex-direction:column}
.points div{display:grid;grid-template-columns:9.5em minmax(0,1fr);gap:4px 16px;padding:10px 0;border-top:1px solid var(--line)}
.points dt{font-weight:700}
.points dd{margin:0;overflow-x:auto}
.ex{background:var(--sunk);border-radius:8px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.ex .q{font-weight:500;overflow-x:auto}
.ex summary{cursor:pointer;color:var(--c);font-weight:700;font-size:14px;width:fit-content}
.ex ol{margin:10px 0 0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px}
.ex li{overflow-x:auto}
.ex .ans{margin-top:10px;font-weight:700}
.trap{border-left:3px solid var(--c);padding-left:14px}
.probs{display:flex;flex-direction:column;gap:12px}
.plabel{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px}
.lv{font-weight:700;font-size:11.5px;line-height:1;padding:4px 9px;border-radius:10px;border:1.5px solid var(--line);color:var(--muted)}
.lv-a{border-color:var(--c);color:var(--c)}
.lv-c{background:var(--c);border-color:var(--c);color:var(--on-c)}
.lv-h{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pno{font-family:var(--f-mono);color:var(--muted)}
.uses{font-size:12px;color:var(--muted);margin-left:6px}
.plabel .chip{padding:3px 10px 3px 8px;font-size:12px}
.demo{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:16px 22px;align-items:start}
.demo svg{width:100%;height:auto;background:var(--sunk);border-radius:8px;overflow:hidden}
.ctl{display:flex;flex-direction:column;gap:12px;min-width:0}
.ctl label{display:flex;flex-direction:column;gap:2px;font-family:var(--f-mono);font-size:13px}
.ctl input{accent-color:var(--c);width:100%}
.cap{font-family:var(--f-mono);font-size:14px;font-weight:500}
.note{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 9px;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);
  color:var(--ink);font:500 13px/1.3 var(--f-body);cursor:pointer}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip:hover{border-color:var(--c)}
.chip small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.none{font-size:13px;color:var(--muted)}
.back{color:var(--muted);font-size:13px;width:fit-content}
mjx-container{font-size:106%!important}
@media (max-width:780px){ .cols{grid-template-columns:minmax(0,1fr)} .demo{grid-template-columns:minmax(0,1fr)} .points div{grid-template-columns:minmax(0,1fr)} }
@media (prefers-reduced-motion:reduce){ .node,.edge{transition:none} }
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>中高数学マップ</h1>
      <p class="sub">中学1年から数学III・Cまでの37単元を、4つの系統と学年で並べた地図です。単元を選ぶと、前提になる単元とその先の単元が線で浮かび、下に要点・例題・練習問題・グラフが開きます。</p>
    </div>
    <p class="progress"><b id="doneCount">0</b> / <span id="allCount">37</span> 単元 学習済み</p>
  </header>

  <div class="map-scroll" id="top-map"><div class="map" id="map"></div></div>
  <p class="legend">
    <span><i class="l-pre"></i>前提（先に学んでおく単元）</span>
    <span><i class="l-next"></i>発展（この単元を使う単元）</span>
    <span><i class="l-done"></i>学習済み</span>
  </p>

  <article class="detail" id="detail"></article>
</div>

<script>window.TOPICS=[];window.R=String.raw;
window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},svg:{fontCache:'global'},options:{enableMenu:false}};</script>
<script src="data-jhs.js"></script>
<script src="data-j3.js"></script>
<script src="data-h1.js"></script>
<script src="data-h2.js"></script>
<script src="data-h3.js"></script>
<script>window.PROBLEMS={};</script>
<script src="problems-j1.js"></script>
<script src="problems-j2.js"></script>
<script src="problems-j3.js"></script>
<script src="problems-h1.js"></script>
<script src="problems-h2.js"></script>
<script src="problems-h2b.js"></script>
<script src="problems-h3.js"></script>
<script src="problems-h3b.js"></script>
<script src="app.js"></script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"></script>
</body>
</html>
