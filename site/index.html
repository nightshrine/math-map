<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0;font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>中高数学マップ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* layout: 夜空の星図（全画面・ドラッグとピンチで動かす）→ 星座（章）→ 星（項）のステージを1画面ずつ。夜空の1テーマに固定 */
:root{
  color-scheme:dark;
  --bg:#070b1d; --bg2:#0d1430; --panel:#131b3d; --panel2:#1b2552; --ink:#eaeefb; --muted:#9aa6cc; --line:#2b376b;
  --alg:#7fb0ff; --fn:#ff9a76; --geo:#5fe0b5; --dat:#c9a2ff; --gold:#ffd166; --on-c:#0a0f24; --ok:#5fe0b5; --ng:#ff8fa3;
  --f-display:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,monospace;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;overflow:hidden;overscroll-behavior:none}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.ch:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
#app{position:relative;height:100%;overflow:hidden;background:radial-gradient(120% 90% at 70% 0%,#16204d 0%,var(--bg2) 38%,var(--bg) 100%)}
#sky{position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);pointer-events:none}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map.drag{cursor:grabbing}

/* 星図 */
.edge{fill:none;stroke-width:1.2;opacity:.26;vector-effect:non-scaling-stroke}
.edge.on{opacity:.95;stroke-width:2}
.band{stroke:var(--line);stroke-width:1;opacity:.5;vector-effect:non-scaling-stroke;stroke-dasharray:2 7}
.rg{font:700 15px var(--f-display);fill:var(--ink);text-anchor:middle;letter-spacing:.08em;opacity:.9}
.rg-sub{font:400 10.5px var(--f-mono);fill:var(--muted);text-anchor:middle;letter-spacing:.12em}
.ch{cursor:pointer}
.ch .halo{opacity:.5;animation:tw 4.5s ease-in-out infinite}
.ch .core{fill:#fff}
.ch .ring-bg{fill:none;stroke:var(--c);stroke-width:1.5;opacity:.35}
.ch .ring{fill:none;stroke:var(--c);stroke-width:3;stroke-linecap:round}
.ch .sat{fill:var(--c);opacity:.85}
.ch .lbl{font:500 12px var(--f-body);fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-width:3.5px;stroke-linejoin:round}
.ch .cnt{font:500 9.5px var(--f-mono);fill:var(--muted);text-anchor:middle}
.ch.done .core{fill:var(--c)}
.ch.done .halo{opacity:.95}
.ch:hover .halo,.ch.focus .halo{opacity:1}
@keyframes tw{0%,100%{opacity:.42}50%{opacity:.72}}

/* HUD */
.hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding:14px var(--gr) 26px var(--gl);pointer-events:none;background:linear-gradient(rgba(7,11,29,.85),rgba(7,11,29,0))}
.hud>*{pointer-events:auto}
.hud h1{font:900 22px/1.2 var(--f-display);letter-spacing:.06em}
.hud .sub{font-size:12px;color:var(--muted)}
.hud-r{display:flex;align-items:center;gap:10px}
.lit{font:500 12px var(--f-mono);color:var(--muted);white-space:nowrap}
.lit b{font-size:17px;color:var(--gold);font-weight:500}
.pill{border:1px solid var(--line);background:rgba(19,27,61,.85);border-radius:18px;padding:6px 14px;font-size:13px;font-weight:500;white-space:nowrap}
.pill:hover{border-color:var(--muted)}
.legend{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:center;font-size:12px;color:var(--muted);
  padding:22px var(--gr) calc(12px + env(safe-area-inset-bottom,0px)) var(--gl);pointer-events:none;background:linear-gradient(rgba(7,11,29,0),rgba(7,11,29,.85))}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px;box-shadow:0 0 8px var(--c)}
.legend .hint{flex-basis:100%;text-align:center;font-size:11.5px;opacity:.8}

/* 重なる画面（星座・ステージ） */
.layer{position:absolute;inset:0;display:flex;flex-direction:column;background:rgba(7,11,29,.93);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  animation:zoomin .34s cubic-bezier(.2,.8,.2,1)}
.layer.out{animation:zoomout .2s ease-in forwards}
@keyframes zoomin{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
@keyframes zoomout{to{opacity:0;transform:scale(.92)}}
.l-head{display:flex;align-items:center;gap:12px;padding:12px var(--gr) 10px var(--gl);border-bottom:1px solid var(--line)}
.l-head .tt{flex:1;min-width:0}
.crumb{font:400 11px var(--f-mono);letter-spacing:.08em;color:var(--c,var(--muted))}
.l-head h2{font:900 19px/1.3 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{flex:none;min-width:40px;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--panel);font-size:14px;padding:0 12px}
.ret{align-self:center;margin:10px var(--gr) 0 var(--gl);border:1px solid var(--gold);color:var(--gold);background:rgba(255,209,102,.08);border-radius:18px;padding:6px 16px;font-size:13px;font-weight:500}

/* 星座（章の中の道） */
.cs-body{flex:1;overflow-y:auto;padding:18px var(--gr) 60px var(--gl)}
.cs-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.cs-lead{color:var(--muted);font-size:14px}
.path{position:relative}
.path svg{position:absolute;left:50%;top:0;overflow:visible;pointer-events:none}
.path-line{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:3 6}
.sec{position:absolute;left:0;right:0;text-align:center;font:500 11.5px var(--f-mono);letter-spacing:.14em;color:var(--muted);transform:translateY(-50%)}
.sec span{background:var(--bg);padding:2px 12px;border-radius:10px;border:1px solid var(--line)}
.st{position:absolute;display:flex;align-items:center;gap:12px;transform:translateY(-50%);background:none;border:0;padding:0;text-align:left}
.st.lft{flex-direction:row-reverse;text-align:right}
.orb{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--c);background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.14),rgba(255,255,255,0) 70%),var(--panel);
  display:grid;place-items:center;font:500 13px var(--f-mono);color:var(--c);box-shadow:0 0 14px -2px var(--c);transition:transform .15s}
.st:hover .orb{transform:scale(1.1)}
.st.why .orb{border-radius:10px;transform:rotate(45deg) scale(.86);border-color:var(--gold);color:var(--gold);box-shadow:0 0 14px -2px var(--gold)}
.st.why:hover .orb{transform:rotate(45deg) scale(.96)}
.orb span{display:block}
.st.why .orb span{transform:rotate(-45deg)}
.st.done .orb{background:var(--c);color:var(--on-c)}
.st.why.done .orb{background:var(--gold)}
.st .nm{font-weight:700;font-size:14px;line-height:1.4;max-width:min(190px,42vw);display:flex;flex-direction:column}
.st .nm small{font:400 10.5px var(--f-mono);color:var(--muted);letter-spacing:.06em}
.st.why .nm small{color:var(--gold)}

/* ステージ */
.dots{display:flex;gap:4px;padding:10px var(--gr) 0 var(--gl);justify-content:center}
.dots i{flex:1;max-width:34px;height:4px;border-radius:2px;background:var(--line)}
.dots i.on{background:var(--c)}
.sg-body{flex:1;overflow-y:auto;padding:22px var(--gr) 28px var(--gl);display:flex}
.screen{max-width:880px;width:100%;margin:auto;display:flex;flex-direction:column;gap:18px;animation:slide .26s ease-out;font-size:16px;min-width:0}
.screen.back{animation-name:slideb}
@keyframes slide{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes slideb{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.kind{font:500 11.5px var(--f-mono);letter-spacing:.14em;color:var(--c)}
.screen h3{font:900 clamp(22px,4.6vw,30px)/1.3 var(--f-display);text-wrap:balance}
.screen h4{font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--muted);margin:0}
.lead{font-size:17px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.why{border-color:rgba(255,209,102,.5)}
.sx{overflow-x:auto;overflow-y:hidden;padding-block:3px}
.pts{display:flex;flex-direction:column;margin:0}
.pts div{display:grid;grid-template-columns:8.5em minmax(0,1fr);gap:4px 14px;padding:11px 0;border-top:1px solid var(--line)}
.pts div:first-child{border-top:0}
.pts dt{font-weight:700;color:var(--c)}
.pts dd{margin:0;overflow-x:auto;overflow-y:hidden;padding-block:3px}
.steps{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px}
.steps li{min-width:0;animation:slide .22s ease-out}
.ans{font-weight:700;color:var(--gold);animation:slide .22s ease-out}
.btn{border:1px solid var(--c);color:var(--c);background:transparent;border-radius:22px;padding:9px 20px;font-weight:700;font-size:14px;align-self:flex-start}
.btn.fill{background:var(--c);color:var(--on-c)}
.btn.ghost{border-color:var(--line);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px}
.lv{font-weight:700;font-size:11.5px;line-height:1;padding:4px 9px;border-radius:10px;border:1.5px solid var(--line);color:var(--muted);align-self:flex-start}
.lv-a{border-color:var(--c);color:var(--c)} .lv-c{background:var(--c);border-color:var(--c);color:var(--on-c)} .lv-h{background:var(--gold);border-color:var(--gold);color:var(--on-c)}
.plabel{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 9px;border:1px solid var(--line);border-radius:16px;background:var(--panel);font-size:13px;font-weight:500}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c)}
.chip:hover{border-color:var(--c)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.choice{border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 14px;text-align:center;min-height:52px;overflow-x:auto}
.choice:hover{border-color:var(--muted)}
.choice.ok{border-color:var(--ok);background:rgba(95,224,181,.12)} .choice.ng{border-color:var(--ng);background:rgba(255,143,163,.1)}
.fb{font-weight:500} .fb.ok{color:var(--ok)} .fb.ng{color:var(--ng)}
table.inc{border-collapse:collapse;font-size:15px;width:100%}
table.inc th,table.inc td{border:1px solid var(--line);padding:6px 8px;text-align:center}
table.inc th{color:var(--muted);font-weight:500}
.fig{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px 22px;align-items:start}
.fig svg{width:100%;height:auto;background:var(--bg2);border:1px solid var(--line);border-radius:12px;overflow:hidden;touch-action:pan-y}
.fig-ctl{display:flex;flex-direction:column;gap:12px;min-width:0}
.fig-ctl label{display:flex;flex-direction:column;gap:2px;font:400 13px var(--f-mono);color:var(--muted)}
.fig-ctl label b{color:var(--ink);font-weight:500}
.fig-ctl input[type=range]{width:100%;accent-color:var(--c);height:28px}
.readout{font:500 14px/1.7 var(--f-mono);background:var(--panel);border-radius:10px;padding:10px 12px;border:1px solid var(--line)}
.readout b{color:var(--gold);font-weight:500} .readout i{font-style:normal;color:var(--c)}
.note{font-size:13.5px;color:var(--muted)}
.sg-foot{display:flex;align-items:center;gap:12px;padding:10px max(var(--gr),calc((100% - 880px)/2)) calc(12px + env(safe-area-inset-bottom,0px)) max(var(--gl),calc((100% - 880px)/2));border-top:1px solid var(--line);background:rgba(7,11,29,.6)}
.sg-foot .count{flex:1;text-align:center;font:400 12px var(--f-mono);color:var(--muted)}
.nav{min-width:104px;height:46px;border-radius:23px;border:1px solid var(--line);background:var(--panel);font-weight:700}
.nav.next{background:var(--c);border-color:var(--c);color:var(--on-c)}
.nav:disabled{opacity:.35;cursor:default}
.clear{align-items:center;text-align:center;padding-top:4vh}
.burst{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,#fff 0 12%,var(--c) 22%,rgba(255,255,255,0) 68%);animation:burst 1.1s cubic-bezier(.2,.9,.2,1)}
@keyframes burst{0%{transform:scale(.1);opacity:0}55%{transform:scale(1.35);opacity:1}100%{transform:scale(1)}}
.sheet{position:absolute;right:var(--gr);top:62px;z-index:5;width:min(320px,calc(100% - 32px));background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 18px 40px rgba(0,0,0,.5)}
mjx-container{font-size:108%!important}
/* 大きい画面では、重なる画面と見出しを拡大して画面を広く使う */
@media (min-width:1700px){#constel,#stage,.hud,.legend{zoom:1.22}}
@media (min-width:2300px){#constel,#stage,.hud,.legend{zoom:1.5}}
@media (max-width:720px){ .fig{grid-template-columns:minmax(0,1fr)} .pts div{grid-template-columns:minmax(0,1fr)} .hud .sub,.lit-t{display:none} .hud h1{font-size:18px;white-space:nowrap} .legend .hint{display:none} .nav{flex:1;min-width:0} .sg-foot .count{flex:none} }
@media (prefers-reduced-motion:reduce){ .layer,.screen,.steps li,.ans,.burst,.ch .halo{animation:none!important} }
</style>
</head>
<body>
<div id="app">
  <canvas id="sky" aria-hidden="true"></canvas>
  <svg id="map" role="application" aria-label="単元の星図"><g id="world"></g></svg>
  <header class="hud">
    <div><h1>中高数学マップ</h1><p class="sub">星座は教科書の章、星はその中の項。星を選ぶと、1画面ずつ学べます。</p></div>
    <div class="hud-r"><span class="lit"><span class="lit-t">灯した星 </span><b id="litN">0</b> / <span id="litAll">0</span></span><button type="button" class="pill" id="fitBtn">全体を見る</button></div>
  </header>
  <p class="legend">
    <span style="--c:var(--alg)"><i></i>数と式</span><span style="--c:var(--fn)"><i></i>関数と解析</span><span style="--c:var(--geo)"><i></i>図形</span><span style="--c:var(--dat)"><i></i>データと確率</span>
    <span class="hint">ドラッグで移動、ピンチやホイールで拡大。星座を選ぶと中に入れます</span>
  </p>
  <section id="constel" class="layer" hidden></section>
  <section id="stage" class="layer" hidden></section>
</div>

<script>window.TOPICS=[];window.PROBLEMS={};window.STARS=[];window.FIGS={};window.R=String.raw;
window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},svg:{fontCache:'global'},options:{enableMenu:false}};</script>
<script src="data-jhs.js"></script>
<script src="data-j3.js"></script>
<script src="data-h1.js"></script>
<script src="data-h2.js"></script>
<script src="data-h3.js"></script>
<script src="problems-j1.js"></script>
<script src="problems-j2.js"></script>
<script src="problems-j3.js"></script>
<script src="problems-h1.js"></script>
<script src="problems-h2.js"></script>
<script src="problems-h2b.js"></script>
<script src="problems-h3.js"></script>
<script src="problems-h3b.js"></script>
<script src="stars-bibun.js"></script>
<script src="stars-sekibun.js"></script>
<script src="core.js"></script>
<script src="figs.js"></script>
<script src="stage.js"></script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"></script>
</body>
</html>
